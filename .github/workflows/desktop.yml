name: Desktop installers

# Installers are cut from `v*` tags so a desktop release is an explicit,
# versioned act rather than a side effect of every push to master. The tag must
# be `v` + desktop/package.json `version`: electron-builder stamps that version
# into the installer names and updater metadata, and the in-app updater resolves
# `/releases/latest` by tag, so any other tag scheme would leave the git tag and
# the installers disagreeing about which version they are. The `release` job
# enforces the match before it creates anything.
#
# Packaging and releasing are separate jobs. Each platform packages with
# `--publish never` and hands its installers over as a workflow artifact; a
# single `release` job then assembles and publishes ONE GitHub release from all
# three. Letting each matrix leg publish on its own used to race and leave three
# draft releases for the same tag. The manual trigger exists to smoke-test the
# packaging pipeline on a branch; those runs only upload artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default, matching ci.yml. Only the release job is granted a
# writable token, and only because it creates the GitHub release; the
# packaging jobs never talk to the GitHub API.
permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # A broken Windows build should not cancel a good macOS or Linux one (or
      # vice versa); each platform's installer is independently useful.
      fail-fast: false
      matrix:
        include:
          # macOS builds must run on macOS: electron-builder can only produce
          # signed/notarizable .dmg and .zip bundles there. Both Intel and Apple
          # Silicon are built from the one runner.
          - os: macos-latest
            args: --mac --x64 --arm64
          - os: windows-latest
            args: --win --x64
          # Linux ships as a single x64 AppImage aimed at immutable gaming distros
          # (Bazzite, SteamOS); see ADR 0007 for why there is no deb/rpm/flatpak.
          - os: ubuntu-latest
            args: --linux --x64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Builds the client with a relative Vite base (so assets resolve under the
      # app's custom protocol) and compiles the Electron main/preload. The server
      # URL is baked into desktop/dist/config.json at this step; set the
      # RACING_SERVER_URL repository variable to point installers at the deployed
      # server. Unset, it defaults to ws://localhost:8080, which is only useful
      # for local testing.
      - run: npm run desktop:build
        env:
          RACING_SERVER_URL: ${{ vars.RACING_SERVER_URL }}
      # Always `--publish never`: uploading is the release job's business. The
      # `publish` block in electron-builder.yml is still consulted here, because
      # it is what makes electron-builder write app-update.yml (the updater's
      # pointer to this repo) and the latest*.yml / .blockmap metadata into
      # desktop/release. `shell: bash` keeps the command identical on Windows.
      #
      # Signing is optional. When the CSC_*/APPLE_* secrets are absent
      # electron-builder produces unsigned installers, which macOS Gatekeeper
      # and Windows SmartScreen will warn about but still allow.
      #
      # Secrets that are not configured arrive as empty strings, and electron-builder
      # treats an empty CSC_LINK as "a certificate at path ''", which fails with
      # "not a file". Unset any empty signing variables so it falls back to unsigned
      # builds, and skip the keychain identity search on macOS in that case.
      - run: |
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || unset "$v"
          done
          [ -n "${CSC_LINK:-}" ] || export CSC_IDENTITY_AUTO_DISCOVERY=false
          npx electron-builder ${{ matrix.args }} --publish never
        working-directory: desktop
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # The artifact is the hand-off to the release job on tag pushes and the
      # deliverable of a manual smoke-test run. The .yml and .blockmap files are
      # the auto-update metadata electron-builder writes alongside the installers;
      # installed apps read the installer names out of latest*.yml, so they must
      # travel together.
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.yml
            # electron-builder's own debug dump also matches *.yml; keep it out of releases.
            !desktop/release/builder-debug.yml
            desktop/release/*.blockmap
          retention-days: 7

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The notes script walks tags and history to find the previous release
          # and the commits since; a shallow checkout has neither.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # All three platform artifacts land flat in one directory, which is what
      # `gh release create` wants to attach.
      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
      - name: Check the tag matches desktop/package.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(node -p "require('./desktop/package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag '$TAG' does not match desktop/package.json version '$VERSION' (expected tag 'v$VERSION'). Bump the version and re-tag."
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Generate release notes
        run: node desktop/scripts/release-notes.mjs "$TAG" > notes.md
      # The release is created as a draft only so every asset is attached before
      # it becomes visible: the in-app updater reads `/releases/latest` and would
      # otherwise see a release missing its installers or `latest*.yml`. Once the
      # uploads finish the draft is flipped to published in the same run, so
      # pushing the tag is the release act. Re-running the workflow on the same
      # tag updates the existing release in place instead of failing on
      # "release already exists"; it is moved back to draft first for the same
      # reason, so a rerun never exposes a half-replaced asset set (or, if an
      # upload fails, a partial one) as the latest release.
      - name: Create or update the release, then publish it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l release-assets
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; unpublishing, then replacing assets and notes"
            gh release edit "$TAG" --draft=true
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --draft --title "Sunset Ridge Racing $VERSION" --notes-file notes.md release-assets/*
          fi
          gh release edit "$TAG" --draft=false --latest
