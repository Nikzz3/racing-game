name: CI

# A branch with an open PR matches both `push` and `pull_request`, which used to run
# the whole workflow twice per commit. Restricting `push` to master keeps trunk covered
# while feature branches are covered exactly once, by their PR.
on:
  push:
    branches: [master]
  pull_request:
    branches: ["**"]

# Every job only reads the repo; none should hold a writable token, and test code
# must not be able to lift credentials out of .git/config.
permissions:
  contents: read

jobs:
  js-tests:
    name: TypeScript typecheck + vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The server's Postgres-backed tests (server/src/test-database.ts) are opt-in
    # locally and always on here, so SQL-level rules such as "a slower lap never
    # overwrites a personal best" are proven on every push without a browser.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: racing_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d racing_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      SERVER_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/racing_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: Playwright e2e tests
    runs-on: ubuntu-latest
    # docs/agents/e2e-testing.md budgets 15 minutes of CI wall time for this suite.
    timeout-minutes: 15
    # Same Postgres major as production and the server tests. A service container
    # starts before checkout in ~9s; letting the wrapper pull and boot its own
    # testcontainer inside the test step took ~14s. The runner image's preinstalled
    # PostgreSQL would be faster still, but it is 16.x.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # The suite creates racing_e2e_w* databases on this server and truncates only those.
      E2E_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      E2E_DATABASE_ALLOW_TRUNCATE: "1"
      # Wall time is bounded by the one full-lap journey (~55s). Pinned to 4 CPUs,
      # three workers finished the rest alongside it about 10s sooner than two; four
      # measured no faster than two, each test slowed by the contention.
      E2E_WORKERS: "3"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        id: node
        with:
          node-version-file: .nvmrc
          cache: npm
      # Restoring node_modules whole beats rebuilding it from the npm cache (~5s vs
      # 15-25s). The key carries the Node version because native and .vite dep
      # bundles are version-specific. A miss falls back to `npm ci` below.
      - uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: |
            node_modules
            */node_modules
          key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci
      # The browser download is the slow half of `playwright install`; keyed on the
      # lockfile so a Playwright bump refreshes it. Headless mode only needs the
      # headless shell, not the full Chromium build.
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      # No client build: Vite serves the client and the server readiness probe
      # hits /healthz, which does not need client/dist.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          # outputFolder in playwright.config.ts resolves relative to that config's
          # directory, so the report lands under e2e/, not the repo root.
          path: e2e/playwright-report/
          retention-days: 7

  python-golden-tests:
    name: Python physics golden tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install RL package with test dependencies
        run: pip install -e "./rl[dev]"
      - name: Run golden fidelity tests
        run: python -m pytest rl/tests/ -v
