# electron-builder configuration for Sunset Ridge Racing.
#
# From the repo root, `npm run desktop:build` builds the client with a relative Vite
# base and compiles this workspace; then `npm run desktop:dist` packages it.
#
# Code signing / notarization (all optional; unsigned builds still work but
# macOS Gatekeeper and Windows SmartScreen will warn users before launch):
#   CSC_LINK                    base64 or file path of the .p12 signing certificate
#                               (Developer ID Application on mac, Authenticode on win)
#   CSC_KEY_PASSWORD            password for that certificate
#   APPLE_ID                    Apple account e-mail used for notarization
#   APPLE_APP_SPECIFIC_PASSWORD app-specific password for that Apple ID
#   APPLE_TEAM_ID               10-character Apple Developer team id
# Set CSC_IDENTITY_AUTO_DISCOVERY=false to force an unsigned local build on a
# machine that has certificates in its keychain.

appId: com.sunsetridge.racing
productName: Sunset Ridge Racing
copyright: Copyright © 2026 Nick Zimmermann

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - "!**/*.map"

extraResources:
  - from: ../client/dist
    to: client

asar: true
# Ad-hoc signs the macOS bundle when no certificate is configured; see the script.
afterPack: scripts/after-pack.cjs
npmRebuild: false

# One naming template for every platform, with no spaces: GitHub rewrites spaces
# in asset names to dots, which breaks both the download links in the release
# notes and the file names electron-updater reads from latest*.yml. `${os}`
# renders as mac/win/linux and `${arch}` as x64/arm64 (mac), x64 (win) or x86_64
# (AppImage). desktop/scripts/release-notes.mjs derives its links from this
# template, so change both together.
artifactName: Sunset-Ridge-Racing-${version}-${os}-${arch}.${ext}

mac:
  category: public.app-category.games
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarization is off by default so unsigned local builds succeed. To enable,
  # set `notarize: true` and provide APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and
  # APPLE_TEAM_ID (plus CSC_LINK / CSC_KEY_PASSWORD for the signing cert).
  notarize: false

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  # AppImage only, x64 only. The target audience is immutable gaming distros
  # (Bazzite, SteamOS) where a self-contained executable that never touches the
  # package manager is the right shape; deb/rpm/flatpak/snap are deliberately
  # not built. The .desktop entry is what Steam and app launchers read when the
  # AppImage is integrated.
  target:
    - target: AppImage
      arch: [x64]
  category: Game
  executableName: sunset-ridge-racing
  # Names the installed .desktop file after `desktopName` in package.json so
  # StartupWMClass matches Electron's app_id and launchers/Steam can associate the
  # running window with the entry.
  syncDesktopName: true
  # Becomes the .desktop file's Comment= line (electron-builder always writes it
  # from `description`, so it cannot be set under `desktop.entry`).
  description: 3D multiplayer arcade racing, from the browser to your desktop
  desktop:
    entry:
      Name: Sunset Ridge Racing
      Categories: Game;

# Uploads no longer go through electron-builder (the workflow always packages with
# `--publish never` and a separate job creates the release with `gh`), but this
# block must stay: it is what makes electron-builder write app-update.yml into
# the bundle, which is how electron-updater knows which GitHub repo to poll.
publish:
  provider: github
  owner: Nikzz3
  repo: racing-game
  releaseType: draft
