<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1055"/>
      <stop offset="0.55" stop-color="#7b2d8b"/>
      <stop offset="1" stop-color="#ff6b35"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#ff5e62"/>
    </linearGradient>
    <clipPath id="rounded">
      <rect width="64" height="64" rx="14"/>
    </clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <rect width="64" height="64" fill="url(#sky)"/>
    <!-- striped synthwave sun -->
    <g>
      <circle cx="32" cy="34" r="17" fill="url(#sun)"/>
      <g stroke="#7b2d8b" stroke-width="2">
        <line x1="13" y1="30" x2="51" y2="30"/>
        <line x1="13" y1="36" x2="51" y2="36"/>
        <line x1="13" y1="42" x2="51" y2="42"/>
      </g>
    </g>
    <!-- ridge silhouette -->
    <path d="M0 46 L12 36 L22 44 L34 33 L46 43 L56 37 L64 44 L64 64 L0 64 Z" fill="#1a1033"/>
    <!-- road converging toward the sun -->
    <path d="M18 64 L29 46 L35 46 L46 64 Z" fill="#3c2a63"/>
    <path d="M31.5 49 L32.5 49 L32.8 52.5 L31.2 52.5 Z" fill="#ffe066"/>
    <!-- racing car, rear view -->
    <g>
      <rect x="19" y="57" width="6.5" height="7" rx="2" fill="#120b24"/>
      <rect x="38.5" y="57" width="6.5" height="7" rx="2" fill="#120b24"/>
      <rect x="24.5" y="46.5" width="15" height="11" rx="4.5" fill="#ff2e4d"/>
      <rect x="21" y="52" width="22" height="12" rx="3.6" fill="#ff2e4d"/>
      <rect x="27" y="48.8" width="10" height="5.6" rx="2.2" fill="#1a1033"/>
      <rect x="23.2" y="56.2" width="5" height="3" rx="1.5" fill="#ffe066"/>
      <rect x="35.8" y="56.2" width="5" height="3" rx="1.5" fill="#ffe066"/>
      <rect x="19.8" y="60.8" width="24.4" height="2.6" rx="1.3" fill="#120b24"/>
    </g>
  </g>
</svg>
