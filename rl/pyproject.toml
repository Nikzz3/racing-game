[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sunset-ridge-rl"
version = "0.1.0"
description = "Python physics port and RL environment for Sunset Ridge Racing"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "gymnasium>=1.0"]

[project.optional-dependencies]
train = ["stable-baselines3>=2.0", "onnxruntime>=1.15"]
dev   = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
