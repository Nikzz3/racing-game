services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: racing
    ports:
      - "5432:5432"
    volumes:
      - racing-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d racing"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  racing-db:
